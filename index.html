<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="WordRush — daily word puzzles and endless five-letter word guessing.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>WordRush — Unlimited Word Game</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--panel:#121a2e;--panel2:#18233b;--line:#2a3855;--text:#f3f6ff;--muted:#9aa8c5;--accent:#8b7cff;--green:#31b879;--yellow:#d9ad39;--gray:#34415a}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172244 0%,var(--bg) 56%);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #b3aaff;outline-offset:3px}
    .app{max-width:520px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 16px;border-bottom:1px solid #ffffff16}
    .brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#a99cff,#6555e9);display:grid;place-items:center;font-weight:950;font-size:20px;box-shadow:0 7px 24px #7d6aff44}
    h1{font-size:19px;letter-spacing:1.7px;margin:0}.subbrand{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.5px}
    .iconbtn{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:#ffffff08;font-size:18px}
    .modes{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#090e1b99;border:1px solid #ffffff12;border-radius:16px;padding:5px;margin:18px 0 14px}
    .mode{border:0;border-radius:11px;padding:11px 8px;background:transparent;color:var(--muted);font-size:13px;font-weight:750;transition:.2s}
    .mode.active{background:linear-gradient(135deg,#8c7bff,#6555df);color:white;box-shadow:0 5px 18px #6c5ce755}
    .status{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin-bottom:12px}
    .pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:#ffffff06;color:#c9d1e6}
    .board{display:grid;grid-template-rows:repeat(6,1fr);gap:7px;width:min(100%,330px);margin:0 auto 18px;aspect-ratio:5/6}
    .rowtiles{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
    .tile{display:grid;place-items:center;border:1.5px solid #33415f;border-radius:10px;background:#111a2d;font-size:clamp(22px,6vw,30px);font-weight:850;text-transform:uppercase;transition:transform .14s,border-color .14s;min-width:0}
    .tile.filled{border-color:#8795b6;animation:pop .12s ease-out}.tile.flip{animation:flip .48s ease}
    .tile.correct{background:var(--green);border-color:var(--green)}.tile.present{background:var(--yellow);border-color:var(--yellow)}.tile.absent{background:var(--gray);border-color:var(--gray)}
    @keyframes pop{50%{transform:scale(1.08)}}@keyframes flip{0%,100%{transform:rotateX(0)}50%{transform:rotateX(90deg)}}
    .message{min-height:25px;text-align:center;font-size:13px;color:#cbd4e9;margin-bottom:9px}
    .keyboard{display:grid;gap:7px;user-select:none;margin-top:auto}
    .keyrow{display:flex;justify-content:center;gap:5px}.key{height:49px;flex:1;max-width:43px;border:0;border-radius:9px;background:#26334d;font-weight:800;font-size:14px;transition:transform .1s,filter .15s}.key:active{transform:scale(.94)}.key.wide{max-width:70px;font-size:11px}.key.correct{background:var(--green)}.key.present{background:#b89127}.key.absent{background:#1a2438;color:#8d9ab5}
    .bottom{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;margin:16px 2px 0}.bottom strong{color:#f2f4ff}
    .overlay{position:fixed;inset:0;background:#050916cc;display:none;align-items:center;justify-content:center;padding:22px;z-index:5}.overlay.show{display:flex}.modal{width:min(100%,390px);border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:23px;box-shadow:0 20px 80px #0008;animation:rise .22s ease-out}.modal h2{margin:0 0 8px}.modal p{color:var(--muted);line-height:1.5;font-size:14px}.modal button{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#9585ff,#6754e8);font-weight:800;margin-top:8px}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .toast{position:fixed;top:calc(env(safe-area-inset-top) + 80px);left:50%;transform:translateX(-50%) translateY(-10px);opacity:0;pointer-events:none;background:#f3f6ff;color:#12172a;padding:10px 16px;border-radius:12px;font-weight:800;font-size:13px;transition:.2s;z-index:8;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:var(--panel2);padding:14px 6px;border-radius:13px;text-align:center}.stat b{font-size:23px;display:block}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
    @media(min-height:800px){.app{padding-top:24px}.board{margin-top:10px;margin-bottom:24px}.key{height:53px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="logo">W</div><div><h1>WORDRUSH</h1><div class="subbrand">GUESS IT. KEEP GOING.</div></div></div>
    <button class="iconbtn" id="statsBtn" aria-label="Statistics">↗</button>

  <nav class="modes" aria-label="Game mode">

  <div class="status"><span id="modeLabel">TODAY'S CHALLENGE</span><span class="pill" id="roundLabel">6 tries</span></div>
  <main>

    <div class="message" id="message" aria-live="polite">Type a word, then hit Enter.</div>
  </main>
  <div class="keyboard" id="keyboard" aria-label="On-screen keyboard"></div>
  <div class="bottom"><span>Made for word lovers ✦</span><span><strong id="streak">0</strong> day streak 🔥</span></div>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

shame","shark","shave","shawl","shear","sheep","sheer","shiny","ships","shoes","shook","shops","shout","shows","shred","shrub","shrug","sigma","signs","sixth","sixty","sized","sizes","skins","skirt","skull","slack","slain","slang","slash","slate","slave","sleek","slick","slime","sling","slips","slots","slows","smash","smoky","snack","snake","sneak","sniff","songs","sonic","sorts","souls","spark","spear","specs","spike","spill","spine","spite","spoil","spoke","spoon","spots","squad","stain","stair","stale","stark","stars","stays","steak","steal","steer","steps","stiff","sting","stink","stole","stool","stove","strap","straw","stray","suits","surge","sushi","swamp","swarm","swear","sweat","sweep","swell","swept","swift","swing","swirl","takes","tales","talks","tally","tasty","teams","tears","tease","tells","tempt","tends","tense","terms","tests","texts","theft","these","thief","thumb","thump","tiger","times","timid","tipsy","toast","tones","tools","tooth","torch","tours","toxic","trace","trail","trait","trash","tries","troop","trunk","tubes","tumor","tuned","tunes","turbo","tutor","twist","typed","types","ulcer","ultra","unite","users","utter","vague","valve","vapor","vault","venue","verse","views","vigor","villa","vinyl","viral","vivid","vocal","votes","wagon","waist","waits","wakes","walks","walls","wants","waves","wears","weeds","weeks","weird","wells","whale","wheat","widen","wider","widow","width","winds","wines","wings","wiped","wired","wires","witch","woods","words","works","wrack","wraps","wrist","yacht","yeast","yield","young","yours","zones"];
const VALID = new Set(WORDS);
const $ = s => document.querySelector(s);
const board = $("#board"), keyboard = $("#keyboard"), message = $("#message");
let mode="daily", answer="", row=0, col=0, guesses=[], finished=false, keyStates={}, toastTimer;
let stats = loadStats();
function loadStats(){try{return Object.assign({played:0,wins:0,streak:0,best:0,lastDaily:"",dailyDone:false,distribution:{}},JSON.parse(localStorage.getItem("wordrush-stats")||"{}"))}catch{return {played:0,wins:0,streak:0,best:0,lastDaily:"",dailyDone:false,distribution:{}}}}
function saveStats(){localStorage.setItem("wordrush-stats",JSON.stringify(stats));$("#streak").textContent=stats.streak}
function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function dailyWord(){return WORDS[hash(todayKey())%WORDS.length]}
function randomWord(){let next=WORDS[Math.floor(Math.random()*WORDS.length)];if(WORDS.length>1&&next===answer)next=WORDS[(WORDS.indexOf(next)+1)%WORDS.length];return next}
function buildBoard(){board.innerHTML="";for(let r=0;r<6;r++){const rr=document.createElement("div");rr.className="rowtiles";for(let c=0;c<5;c++){const t=document.createElement("div");t.className="tile";t.id=`t-${r}-${c}`;rr.append(t)}board.append(rr)}}
function buildKeyboard(){keyboard.innerHTML="";["QWERTYUIOP","ASDFGHJKL","ENTERZXCVBNM⌫"].forEach(line=>{const r=document.createElement("div");r.className="keyrow";let chars=line==="ENTERZXCVBNM⌫"?["ENTER",..."ZXCVBNM","⌫"]:[...line];chars.forEach(ch=>{const b=document.createElement("button");b.className="key"+((ch==="ENTER"||ch==="⌫")?" wide":"");b.textContent=ch;b.dataset.key=ch;b.addEventListener("click",()=>press(ch));r.append(b)});keyboard.append(r)})}
function startGame(newMode=mode){mode=newMode;row=0;col=0;guesses=[];finished=false;keyStates={};answer=mode==="daily"?dailyWord():randomWord();buildBoard();buildKeyboard();document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));$("#modeLabel").textContent=mode==="daily"?"TODAY'S CHALLENGE":"ENDLESS MODE";$("#roundLabel").textContent="6 tries";message.textContent=mode==="daily"&&stats.lastDaily===todayKey()?"Daily challenge complete — check your stats.":"Type a word, then hit Enter.";if(mode==="daily"&&stats.lastDaily===todayKey()){finished=true;message.textContent="You’ve already played today’s puzzle. Come back tomorrow!";}$("#streak").textContent=stats.streak}
function press(k){if(finished)return;if(k==="ENTER"){submitGuess();return}if(k==="⌫"||k==="BACKSPACE"){if(col>0){col--;const t=$(`#t-${row}-${col}`);t.textContent="";t.classList.remove("filled")}return}if(/^[A-Z]$/.test(k)&&col<5){const t=$(`#t-${row}-${col}`);t.textContent=k;t.classList.add("filled");col++}}
function toast(s){const el=$("#toast");el.textContent=s;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),1600)}
function score(guess,answer){let result=Array(5).fill("absent"),remaining={};for(let i=0;i<5;i++){if(guess[i]===answer[i])result[i]="correct";else remaining[answer[i]]=(remaining[answer[i]]||0)+1}for(let i=0;i<5;i++){if(result[i]!=="correct"&&remaining[guess[i]]>0){result[i]="present";remaining[guess[i]]--}}return result}
function submitGuess(){if(col<5){toast("Not enough letters");return}const guess=Array.from({length:5},(_,c)=>$(`#t-${row}-${c}`).textContent.toLowerCase()).join("");if(!WORDS.includes(guess)){toast("That word isn't in this game's dictionary");return}const marks=score(guess,answer);guesses.push(guess);for(let c=0;c<5;c++){const t=$(`#t-${row}-${c}`);setTimeout(()=>{t.classList.add("flip");setTimeout(()=>{t.classList.remove("flip");t.classList.add(marks[c]);const key=document.querySelector(`[data-key="${guess[c].toUpperCase()}"]`);if(key){const old=keyStates[guess[c]];if(!old||marks[c]==="correct"||(marks[c]==="present"&&old==="absent")){keyStates[guess[c]]=marks[c];key.classList.remove("correct","present","absent");key.classList.add(marks[c])}}},220)},c*110)}row++;col=0;setTimeout(()=>{if(guess===answer){endGame(true);return}if(row===6){endGame(false);return}message.textContent="Keep going — you got this.";$("#roundLabel").textContent=`${6-row} ${6-row===1?"try":"tries"} left`},700)}
function endGame(won){finished=true;message.textContent=won?"You got it! 🔥":`The word was ${answer.toUpperCase()}.`;if(mode==="daily"){stats.played++;if(won){stats.wins++;stats.streak=stats.lastDaily===yesterdayKey()?stats.streak+1:1;stats.best=Math.max(stats.best,stats.streak);stats.distribution[guesses.length]=(stats.distribution[guesses.length]||0)+1}else stats.streak=0;stats.lastDaily=todayKey();saveStats()}setTimeout(()=>showResult(won),650)}
function yesterdayKey(){const d=new Date();d.setDate(d.getDate()-1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function showResult(won){$("#modal").innerHTML=`<h2>${won?"✨ Brilliant!":"Good game!"}</h2><p>${mode==="daily"?"Daily challenge complete.":"Endless round complete."} The word was <strong>${answer.toUpperCase()}</strong>.</p><div class="stats"><div class="stat"><b>${guesses.length}/6</b><span>Guesses</span></div><div class="stat"><b>${stats.wins}</b><span>Daily wins</span></div><div class="stat"><b>${stats.streak}</b><span>Streak</span></div></div><button id="nextBtn">${mode==="daily"?"Back to board":"Play another round"}</button><button id="shareBtn" style="background:#26334d;margin-top:8px">Share result</button>`;$("#overlay").classList.add("show");$("#nextBtn").onclick=()=>{$("#overlay").classList.remove("show");if(mode==="endless")startGame("endless")};$("#shareBtn").onclick=()=>{const text=`WordRush ${mode==="daily"?"Daily":"Endless"} ${won?guesses.length:"X"}/6\\n`+guesses.map(g=>score(g,answer).map(m=>m==="correct"?"🟩":m==="present"?"🟨":"⬛").join("")).join("\\n");if(navigator.share)navigator.share({text}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast("Result copied!"));else toast("Sharing isn't available here")}}
function showStats(){$("#modal").innerHTML=`<h2>📈 Your stats</h2><p>Your progress stays on this device.</p><div class="stats"><div class="stat"><b>${stats.played}</b><span>Played</span></div><div class="stat"><b>${stats.played?Math.round(stats.wins/stats.played*100):0}%</b><span>Win rate</span></div><div class="stat"><b>${stats.best}</b><span>Best streak</span></div></div><button id="closeStats">Back to game</button>`;$("#overlay").classList.add("show");$("#closeStats").onclick=()=>$("#overlay").classList.remove("show")}
document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>startGame(b.dataset.mode)));$("#statsBtn").addEventListener("click",showStats);$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")$("#overlay").classList.remove("show")});document.addEventListener("keydown",e=>{if(e.key==="Enter")press("ENTER");else if(e.key==="Backspace")press("BACKSPACE");else if(/^[a-zA-Z]$/.test(e.key))press(e.key.toUpperCase())});
buildBoard();buildKeyboard();startGame("daily");
if("serviceWorker" in navigator && location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
